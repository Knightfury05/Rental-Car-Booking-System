<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="UTF-8">
  <title>Login Page</title>
  <link rel="stylesheet" th:href="@{/css/stylelogin.css}">
</head>
<body>
<section>
  <!-- Falling Leaves Background -->
  <div class="leaves">
    <div class="set">
      <div><img src="/images/leaf_01.png"></div>
      <div><img src="/images/leaf_02.png"></div>
      <div><img src="/images/leaf_03.png"></div>
      <div><img src="/images/leaf_04.png"></div>
      <div><img src="/images/leaf_01.png"></div>
      <div><img src="/images/leaf_02.png"></div>
      <div><img src="/images/leaf_03.png"></div>
      <div><img src="/images/leaf_04.png"></div>
    </div>
  </div>

  <!-- Glassmorphism Login Card -->
  <div class="login-card">
    <h2>Sign In</h2>
    <p class="subtitle">Enter your credentials to access your account</p>

    <form action="/login" method="post">
      <div class="inputBox">
        <input type="text" name="email" placeholder="Email Address" required>
      </div>
      <div class="inputBox passwordBox">
        <input type="password" name="password" placeholder="Password" required>
        <span class="toggle">👁</span>
      </div>

      <div class="options">
        <label><input type="checkbox"> Remember me</label>
        <a href="#">Forgot password?</a>
      </div>

      <div class="inputBox">
        <input type="submit" value="Sign In" id="btn">
      </div>
    </form>

    <p class="signup-text">
      Don’t have an account? <a href="/register">Create one</a>
    </p>
  </div>
</section>
</body>
</html>
